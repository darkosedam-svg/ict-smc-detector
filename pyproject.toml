[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ict-smc-detector"
version = "0.1.0"
description = "Vectorized ICT/SMC pattern detection: Fair Value Gaps, Order Blocks, Break of Structure"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Darko Vlahovic", email = "jessuskrist84@gmail.com" }
]
keywords = ["trading", "ict", "smc", "fair-value-gap", "order-block", "algorithmic-trading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
    "pandas-stubs",
]

[project.urls]
Homepage = "https://github.com/darkosedam-svg/ict-smc-detector"
Repository = "https://github.com/darkosedam-svg/ict-smc-detector"
Issues = "https://github.com/darkosedam-svg/ict-smc-detector/issues"

[tool.hatch.build.targets.wheel]
packages = ["ict_smc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
